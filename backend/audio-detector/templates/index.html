<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AI Voice Detector</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 90%;
            max-width: 600px;
            margin: 80px auto;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            color: #555;
        }

        input[type="file"] {
            margin: 25px 0;
        }

        button {
            background: #222;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #444;
        }

        .result {
            margin-top: 30px;
            padding: 20px;
            border-radius: 10px;
            background: #f0f0f0;
        }

        .result h2 {
            margin: 0;
        }

        .error {
            color: red;
            margin-top: 20px;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>🎙️ AI Voice Detector</h1>

    <p>
        Upload an audio file to check whether
        it sounds AI-generated or human.
    </p>

    <form method="POST"
          enctype="multipart/form-data">

        <input
            type="file"
            name="audio"
            accept="audio/*"
            required
        >

        <br>

        <button type="submit">
            Analyze Audio
        </button>

    </form>


    {% if result %}

    <div class="result">

        <h2>{{ result }}</h2>

        <p>
            Confidence:
            <strong>{{ confidence }}%</strong>
        </p>

    </div>

    {% endif %}


    {% if error %}

    <div class="error">

        Error: {{ error }}

    </div>

    {% endif %}

</div>

</body>

</html>
